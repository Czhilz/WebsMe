<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Informasi Sekolah</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.app-container {
    width: 100%;
    max-width: 1200px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: #fff;
    overflow: hidden;
    position: relative;
}

.navbar {
    background-color: #1a56db;
    height: 50px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 20px;
    color: white;
    z-index: 10;
}

.nav-right i {
    margin-left: 20px;
    font-size: 1.2rem;
    cursor: pointer;
}

.main-content {
    display: flex;
    flex: 1;
    position: relative;
    background-image: url('https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?q=80&w=1920&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
}

.login-panel {
    width: 400px;
    background-color: white;
    height: 100%;
    border-radius: 0 40px 40px 0;
    display: flex;
    flex-direction: column;
    padding: 40px;
    box-shadow: 5px 0 15px rgba(0,0,0,0.1);
    z-index: 5;
    position: relative;
}

.logo-wrapper {
    text-align: center;
    margin-bottom: 40px;
    margin-top: 20px;
}

.logo-circle {
    width: 70px;
    height: 70px;
    background-color: #f0b90b;
    border: 4px solid #1a56db;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 15px;
    color: #1a56db;
    font-size: 2rem;
}

.logo-wrapper h1 {
    color: #1a56db;
    font-size: 1.4rem;
    line-height: 1.2;
    font-weight: 700;
}

form {
    display: flex;
    flex-direction: column;
    gap: 15px;
    flex: 1;
}

.input-group {
    position: relative;
    display: flex;
    align-items: center;
}

.input-group input {
    width: 100%;
    padding: 12px 40px;
    border: none;
    background-color: #f0f2f5;
    border-radius: 8px;
    font-size: 0.9rem;
    outline: none;
    color: #333;
}

.icon-left {
    position: absolute;
    left: 15px;
    color: #1a56db;
}

.icon-right {
    position: absolute;
    right: 15px;
    color: #999;
    cursor: pointer;
}

.btn-login {
    background-color: #1a56db;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.3s;
}

.btn-login:hover {
    background-color: #1545b3;
}

.copyright {
    text-align: center;
    font-size: 0.75rem;
    color: #666;
    margin-top: auto;
}

.image-panel {
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 60px;
}

.welcome-text {
    color: white;
    text-align: center;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
}

.welcome-text h2 {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 5px;
}

.welcome-text p {
    font-size: 1.2rem;
}
</style>
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <div class="nav-right">
                <i class="fas fa-home"></i>
                <i class="fas fa-bars"></i>
            </div>
        </nav>
        
        <main class="main-content">
            <div class="login-panel">
                <div class="logo-wrapper">
                    <div class="logo-circle">
                        <i class="fas fa-school"></i>
                    </div>
                    <h1>Sistem Informasi<br>Sekolah</h1>
                </div>
                
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fas fa-user icon-left"></i>
                        <input type="text" id="username" placeholder="Username" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock icon-left"></i>
                        <input type="password" id="password" placeholder="Password" required>
                        <i class="fas fa-eye-slash icon-right" id="togglePassword"></i>
                    </div>
                    
                    <button type="submit" class="btn-login">Login</button>
                </form>
                
                <p class="copyright">© 2026 SMK Pawiyatan Surabaya</p>
            </div>
            
            <div class="image-panel">
                <div class="welcome-text">
                    <h2>Selamat Datang</h2>
                    <p>di Sistem Informasi Sekolah</p>
                </div>
            </div>
        </main>
    </div>
    
    <script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('loginForm');

    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        alert('Login attempted for: ' + username);
    });
    </script>
</body>
</html>
