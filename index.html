<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Informasi Sekolah</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background-color: #0f172a;
    color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.app-container {
    width: 100%;
    max-width: 1200px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: #0f172a;
    overflow: hidden;
    position: relative;
}

.navbar {
    background-color: #1e293b;
    height: 50px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 20px;
    color: #94a3b8;
    z-index: 10;
    border-bottom: 1px solid #334155;
}

.nav-right i {
    margin-left: 20px;
    font-size: 1.2rem;
    cursor: pointer;
    transition: color 0.2s ease;
}

.nav-right i:hover {
    color: #3b82f6;
}

.main-content {
    display: flex;
    flex: 1;
    position: relative;
    /* Replaced heavy Unsplash background image with fast pure CSS gradient */
    background: radial-gradient(circle at 75% 50%, #1e293b 0%, #0f172a 100%);
}

.login-panel {
    width: 400px;
    background-color: #1e293b;
    height: 100%;
    border-radius: 0 30px 30px 0;
    display: flex;
    flex-direction: column;
    padding: 40px;
    box-shadow: 10px 0 30px rgba(0, 0, 0, 0.4);
    z-index: 5;
    position: relative;
    border-right: 1px solid #334155;
}

.logo-wrapper {
    text-align: center;
    margin-bottom: 40px;
    margin-top: 20px;
}

.logo-circle {
    width: 70px;
    height: 70px;
    background-color: #3b82f6;
    border: 3px solid #1e293b;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 15px;
    color: #ffffff;
    font-size: 2rem;
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
}

.logo-wrapper h1 {
    color: #f8fafc;
    font-size: 1.4rem;
    line-height: 1.2;
    font-weight: 700;
}

form {
    display: flex;
    flex-direction: column;
    gap: 18px;
    flex: 1;
}

.input-group {
    position: relative;
    display: flex;
    align-items: center;
}

.input-group input {
    width: 100%;
    padding: 12px 40px;
    border: 1px solid #334155;
    background-color: #0f172a;
    border-radius: 8px;
    font-size: 0.9rem;
    outline: none;
    color: #f8fafc;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-group input::placeholder {
    color: #64748b;
}

.input-group input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
}

.icon-left {
    position: absolute;
    left: 15px;
    color: #3b82f6;
}

.icon-right {
    position: absolute;
    right: 15px;
    color: #64748b;
    cursor: pointer;
}

.icon-right:hover {
    color: #94a3b8;
}

.btn-login {
    background-color: #3b82f6;
    color: #ffffff;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 10px;
    transition: background-color 0.2s ease, transform 0.1s ease;
}

.btn-login:hover {
    background-color: #2563eb;
}

.btn-login:active {
    transform: scale(0.98);
}

.copyright {
    text-align: center;
    font-size: 0.75rem;
    color: #64748b;
    margin-top: auto;
}

.image-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px;
}

.welcome-text {
    text-align: center;
}

.welcome-text h2 {
    font-size: 2.8rem;
    font-weight: 700;
    margin-bottom: 5px;
    background: linear-gradient(135deg, #ffffff 0%, #3b82f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.welcome-text p {
    font-size: 1.2rem;
    color: #94a3b8;
}
</style>
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <div class="nav-right">
                <i class="fas fa-home"></i>
                <i class="fas fa-bars"></i>
            </div>
        </nav>
        
        <main class="main-content">
            <div class="login-panel">
                <div class="logo-wrapper">
                    <div class="logo-circle">
                        <i class="fas fa-school"></i>
                    </div>
                    <h1>Sistem Informasi<br>Sekolah</h1>
                </div>
                
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fas fa-user icon-left"></i>
                        <input type="text" id="username" placeholder="Username" required autocomplete="off">
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock icon-left"></i>
                        <input type="password" id="password" placeholder="Password" required>
                        <i class="fas fa-eye-slash icon-right" id="togglePassword"></i>
                    </div>
                    
                    <button type="submit" class="btn-login">Login</button>
                </form>
                
                <p class="copyright">© 2026 SMK Pawiyatan Surabaya</p>
            </div>
            
            <div class="image-panel">
                <div class="welcome-text">
                    <h2>Selamat Datang</h2>
                    <p>di Sistem Informasi Sekolah</p>
                </div>
            </div>
        </main>
    </div>
    
    <script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('loginForm');

    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        alert('Login attempted for: ' + username);
    });
    </script>
</body>
</html>
